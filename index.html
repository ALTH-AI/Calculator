<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      background: #111827;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .display {
      width: 100%;
      height: 80px;
      margin-bottom: 16px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #e5e7eb;
      color: #111827;
      font-size: 2rem;
      text-align: right;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      background: #374151;
      color: white;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #f59e0b;
      color: #111827;
    }

    .clear {
      background: #ef4444;
    }

    .equal {
      background: #10b981;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" type="text" id="display" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="append('/')">/</button>
      <button class="operator" onclick="append('*')">×</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('-')">−</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('+')">+</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="append('0')" style="grid-column: span 2;">0</button>
      <button onclick="append('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function append(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        const expression = display.value;

        // Basic validation: allow only numbers, operators, and decimal points
        if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
          throw new Error('Invalid expression');
        }

        // Use Function for simple evaluation
        const result = Function(`"use strict"; return (${expression});`)();

        if (!Number.isFinite(result)) {
          throw new Error('Invalid result');
        }

        display.value = result;
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
